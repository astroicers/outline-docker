services:
  outline:
    image: outlinewiki/outline:1.4
    env_file: .env
    # Port 3000 is only accessed via nginx reverse proxy (no host binding needed)
    expose:
      - "3000"
    volumes:
      - ./data:/var/lib/outline/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15
    # 刻意不用 env_file：那會把 .env 的全部密鑰（SECRET_KEY / UTILS_SECRET /
    # OIDC_CLIENT_SECRET / KEYCLOAK_ADMIN_PASSWORD）灌進 postgres 容器，
    # 而它一個都用不到。這些值也會出現在 docker inspect 輸出裡。
    # 下面的 environment 用 ${VAR} 變數替換，compose 仍會從 .env 取值。
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: outline
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 目錄掛載（非單檔）：Docker Desktop/WSL2 重啟後單檔 bind mount 會 exit 127
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: outline
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${AUTH_DOMAIN:-auth.example.com}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start --import-realm
    volumes:
      # 目錄掛載（非單檔）：見 postgres 同上
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/www:/var/www/certbot
    # 偵測「掛載掛成空目錄」的靜默失效：config 要在，且容器內真的有人在聽 443
    healthcheck:
      test: ["CMD-SHELL", "ls /etc/nginx/conf.d/*.conf >/dev/null 2>&1 && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - outline
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    entrypoint: /bin/sh -c "apk add --no-cache curl -q && trap exit TERM; while :; do certbot renew --deploy-hook /opt/scripts/deploy-hook.sh; sleep 12h & wait $${!}; done"
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
      # 掛在 /opt/scripts（非 /etc/letsencrypt 底下）：避免巢狀 bind mount
      - ./scripts:/opt/scripts:ro
      # docker.sock 是刻意保留的單檔掛載：它由 Docker Desktop 提供，
      # 不走 WSL host inode 快取，沒有上述失效模式。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # 單檔改目錄後，掛載失效由「exit 127 停機」變成「靜默掛空」。
    # certbot 是潛伏期最長的一條：hook 掛空 → 憑證更新了但 nginx 永不 reload
    # → 繼續送舊憑證直到過期，中間毫無告警。這裡把它變成可見。
    healthcheck:
      # 同時檢查 curl：entrypoint 每次啟動都 apk add curl，那一步失敗時
      # hook 檔案還在（所以只檢查檔案抓不到），但容器會進入無限重啟迴圈、
      # 憑證再也不會續期。
      test: ["CMD-SHELL", "test -x /opt/scripts/deploy-hook.sh && command -v curl >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres-data:
